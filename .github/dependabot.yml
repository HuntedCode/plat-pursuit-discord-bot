version: 2
updates:
  # pip: one grouped PR a month with every available update, reviewed in the monthly dependency
  # review (a reminder issue opens on the 2nd). Security updates arrive as their own PRs as soon
  # as an advisory is published, once Dependabot security updates are enabled in the repository
  # settings. requirements.txt is fully pinned, so a bump may need its transitive pins adjusted:
  # see CLAUDE.md (Dependencies and CI).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      pip-monthly:
        patterns: ['*']
    commit-message:
      prefix: chore(config)

  # GitHub Actions: keep workflow actions current, since they run with repository access.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-monthly:
        patterns: ['*']
    commit-message:
      prefix: chore(config)
