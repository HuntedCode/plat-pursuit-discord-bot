name: Check

on:
  pull_request:
  push:
    branches: [main]
  # Weekly run on main so a newly published advisory surfaces even when no PR is open.
  schedule:
    - cron: '0 6 * * 1'

# Least privilege: jobs only read the repository. The only credential used is the built-in,
# read-only GITHUB_TOKEN, so pull requests from any branch run safely.
permissions:
  contents: read

# Superseded PR runs are cancelled; runs on main always finish so a failure is never hidden.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The runner OS is pinned (not ubuntu-latest) so the CI environment only changes when we choose.
# Python matches the production image (Dockerfile: python:3.12-slim).
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Fails on any known advisory in the PRODUCTION requirements, which is what the Docker image
      # installs. Every transitive dependency is pinned there, so --no-deps audits exactly what
      # ships. To accept an advisory that has no usable fix, add `--ignore-vuln <ID>` here AND
      # record why in CLAUDE.md (Dependencies and CI); an ignore without a reason is a bug.
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt --no-deps --disable-pip --progress-spinner off
      # The audit only sees pinned packages, so every package the image installs must be pinned.
      # A bump (a Dependabot one included) can need a new or changed transitive pin: installing
      # the pins with no dependency resolution, then `pip check`, fails if any is missing or out
      # of range.
      - name: Check the pins
        run: |
          python -m venv /tmp/pins
          /tmp/pins/bin/pip install --quiet --disable-pip-version-check --no-deps -r requirements.txt
          /tmp/pins/bin/pip check

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Third-party action pinned to a full commit SHA; Dependabot keeps the pin current.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
