version: 2
updates:
  # pip: one grouped PR a month with every minor and patch update, reviewed in the monthly
  # dependency review (a reminder issue opens on the 2nd). Each major update opens its own PR, so
  # one breaking upgrade cannot hold back the rest. Security updates arrive as their own PRs as soon
  # as an advisory is published, once Dependabot security updates are enabled in the repository
  # settings. requirements.txt is fully pinned, so a bump may need its transitive pins adjusted;
  # CI's pin check fails when it does (see CLAUDE.md, Dependencies and CI).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      # tzdata's date versions look like a major update every year; it rides the monthly group
      # whatever the version jump. A package matches the first group that fits, so this comes first.
      pip-date-versioned:
        patterns: [tzdata]
      pip-monthly:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore(config)

  # GitHub Actions: keep workflow actions current, since they run with repository access.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-monthly:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: chore(config)
